# Afiléon Motorsport — migrated balance reminder runner.
# On default branch so GitHub Actions can execute the schedule.
# DISABLED until repository variable AF_MIGRATED_CRON_ENABLED is set to true
# and repository secret CRON_SECRET is configured.
# Disable the old Railway balance cron first to avoid duplicate reminders.
name: Afiléon balance reminders — Render
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  send-reminders:
    if: ${{ vars.AF_MIGRATED_CRON_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call booking balance reminder API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 230 \
            --retry 2 --retry-delay 5 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "https://afileon-api-migration-staging.onrender.com/api/cron/balances" >/dev/null
