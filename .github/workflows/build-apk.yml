name: Build Afileon Pitlane APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'BUILD_TRIGGER.txt'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  keep-signing-key-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Keep Pitlane signing cache active
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: afileon-pitlane-stable-signing-v1

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Pitlane signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: afileon-pitlane-stable-signing-v1

      - name: Ensure stable Pitlane signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Afileon Pitlane, OU=Pitlane, O=Afileon Motorsport, C=GB" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000
          fi

      - name: Verify Pitlane signing identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="3ecf73f03717fdbe6e7adae2f959541526c18b5d736c385d2b3a1261d51655af"
          ACTUAL=$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | awk -F'SHA256: ' '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')
          echo "Pitlane keystore signer SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Pitlane signing identity changed. Refusing to build an incompatible update."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply factory-team layout stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/index.html')
          text = path.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="factory_layout_v057.css">\n'
          if 'factory_layout_v057.css' not in text:
              text = text.replace('</head>', link + '</head>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify finished APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="3ecf73f03717fdbe6e7adae2f959541526c18b5d736c385d2b3a1261d51655af"
          ACTUAL=$(python - <<'PY'
          import hashlib, struct
          from pathlib import Path

          data = Path('app/build/outputs/apk/release/app-release.apk').read_bytes()
          eocd = data.rfind(b'PK\x05\x06')
          if eocd < 0:
              raise SystemExit('APK EOCD not found')
          cd_off = struct.unpack_from('<I', data, eocd + 16)[0]
          if data[cd_off-16:cd_off] != b'APK Sig Block 42':
              raise SystemExit('APK signing block not found')
          size = struct.unpack_from('<Q', data, cd_off - 24)[0]
          block_start = cd_off - (size + 8)
          if struct.unpack_from('<Q', data, block_start)[0] != size:
              raise SystemExit('APK signing block size mismatch')

          pos = block_start + 8
          end = cd_off - 24
          pairs = {}
          while pos < end:
              pair_len = struct.unpack_from('<Q', data, pos)[0]
              pos += 8
              pair_id = struct.unpack_from('<I', data, pos)[0]
              pos += 4
              pairs[pair_id] = data[pos:pos + pair_len - 4]
              pos += pair_len - 4

          def lp(buf, off):
              n = struct.unpack_from('<I', buf, off)[0]
              off += 4
              return buf[off:off+n], off+n

          cert = None
          for pair_id in (0x7109871a, 0xf05368c0, 0x1b93ad61):
              if pair_id not in pairs:
                  continue
              signers, _ = lp(pairs[pair_id], 0)
              signer, _ = lp(signers, 0)
              signed_data, _ = lp(signer, 0)
              _, off = lp(signed_data, 0)
              certs, _ = lp(signed_data, off)
              cert, _ = lp(certs, 0)
              break
          if not cert:
              raise SystemExit('No signer certificate found in APK')
          print(hashlib.sha256(cert).hexdigest())
          PY
          )
          echo "Finished APK signer SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Finished APK is not signed with the permanent Pitlane identity. Refusing to publish."
            exit 1
          fi

      - name: Prepare APK and automatic update manifest
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk Afileon-Pitlane.apk
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          APK_SHA=$(sha256sum Afileon-Pitlane.apk | awk '{print $1}')
          mkdir -p dist
          cp Afileon-Pitlane.apk dist/Afileon-Pitlane.apk
          cat > dist/pitlane-update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "mandatory": false,
            "apkUrl": "https://www.afileonmotorsport.co.uk/downloads/Afileon-Pitlane.apk",
            "sha256": "$APK_SHA",
            "signerSha256": "3ecf73f03717fdbe6e7adae2f959541526c18b5d736c385d2b3a1261d51655af",
            "notes": "A newer Afiléon Pitlane build is available. Pitlane will verify the APK before asking Android to install it."
          }
          EOF
          cat dist/pitlane-update.json

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Afileon-Pitlane-APK
          path: Afileon-Pitlane.apk
          if-no-files-found: error

      - name: Publish automatic updater files to main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo "main moved while this build was running; skipping updater publication to avoid publishing a stale APK."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Afileon-Pitlane.apk dist/pitlane-update.json
          if git diff --cached --quiet; then
            echo "Updater files are already current."
            exit 0
          fi
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          git commit -m "Publish Pitlane ${VERSION_NAME} updater files [skip ci]"
          git push origin HEAD:main
