name: Build Afileon Pitlane APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  keep-signing-key-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Keep Pitlane signing cache active
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: afileon-pitlane-stable-signing-v1

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Pitlane signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: afileon-pitlane-stable-signing-v1

      - name: Ensure stable Pitlane signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Afileon Pitlane, OU=Pitlane, O=Afileon Motorsport, C=GB" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000
          fi
          echo "Stable signing key ready."
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep 'SHA256:' | head -1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Afileon-Pitlane.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Afileon-Pitlane-APK
          path: Afileon-Pitlane.apk
          if-no-files-found: error
