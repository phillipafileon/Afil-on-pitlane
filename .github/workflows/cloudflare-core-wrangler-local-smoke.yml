name: Cloudflare Core Wrangler local D1 smoke (STAGING ONLY)
on:
  push:
    branches:
      - migration/cloudflare-workers-d1-2026-10-18
    paths:
      - 'cloudflare-core/dashboard-staging-worker.js'
      - 'cloudflare-core/wrangler.jsonc'
      - 'cloudflare-core/package.json'
      - 'cloudflare-core/migrations/**'
      - 'cloudflare-core/tests/smoke-local-worker.mjs'
      - 'cloudflare-core/tests/harness-booking-worker.mjs'
      - 'cloudflare-core/tests/stress-local-d1-booking.mjs'
      - 'cloudflare-core/tools/generate-local-hold-sql.mjs'
      - 'cloudflare-core/booking/atomic-booking-hold-full.sql'
      - 'cloudflare-core/tests/harness-stripe-worker.mjs'
      - 'cloudflare-core/tests/verify-local-d1-webhook.mjs'
      - 'cloudflare-core/tools/generate-local-payment-sql.mjs'
      - 'cloudflare-core/webhooks/**'
      - 'cloudflare-core/stripe-signature.mjs'
      - 'cloudflare-core/admin/**'
      - 'cloudflare-core/tests/harness-admin-worker.mjs'
      - 'cloudflare-core/tests/verify-local-d1-admin.mjs'
      - '.github/workflows/cloudflare-core-wrangler-local-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-worker-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install staging-only Cloudflare tooling (no deploy credentials)
        working-directory: cloudflare-core
        run: npm install --no-audit --no-fund
      - name: Test baseline and expanded schemas using LOCAL Wrangler D1
        shell: bash
        working-directory: cloudflare-core
        run: |
          set -euo pipefail
          STATE_DIR="$PWD/.wrangler/test-state"
          mkdir -p "$STATE_DIR"
          npx wrangler d1 execute afileon-core-staging --config wrangler.jsonc --local --persist-to "$STATE_DIR" --file=migrations/0001_neon_schema_draft.sql
          start_worker() {
            npx wrangler dev ./dashboard-staging-worker.js --config wrangler.jsonc --local --persist-to "$STATE_DIR" --ip 127.0.0.1 --port 8787 > /tmp/afileon-worker-smoke.log 2>&1 &
            WORKER_PID=$!
            local ready=0
            for i in {1..45}; do
              if ! kill -0 "$WORKER_PID" 2>/dev/null; then
                cat /tmp/afileon-worker-smoke.log
                return 1
              fi
              if curl -fsS http://127.0.0.1:8787/__migration/health > /tmp/afileon-health.json 2>/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [[ "$ready" != "1" ]]; then
              cat /tmp/afileon-worker-smoke.log
              return 1
            fi
          }
          stop_worker() {
            if [[ -n "${WORKER_PID:-}" ]]; then
              kill "$WORKER_PID" || true
              wait "$WORKER_PID" || true
              WORKER_PID=""
            fi
          }
          trap stop_worker EXIT
          start_worker
          node tests/smoke-local-worker.mjs 25 13
          stop_worker
          npx wrangler d1 execute afileon-core-staging --config wrangler.jsonc --local --persist-to "$STATE_DIR" --file=migrations/0002_webhook_inbox_staging.sql
          start_worker
          node tests/smoke-local-worker.mjs 26 14
          stop_worker
          # Test the actual atomic SQL against the same local D1 engine.
          # The harness is NEVER published and requires a CI-only opt-in var.
          node tools/generate-local-hold-sql.mjs
          npx wrangler dev ./tests/harness-booking-worker.mjs --config wrangler.jsonc --local --persist-to "$STATE_DIR" --var LOCAL_D1_TEST:only_action_runner --ip 127.0.0.1 --port 8788 > /tmp/afileon-booking-harness.log 2>&1 &
          WORKER_PID=$!
          ready=0
          for i in {1..45}; do
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              cat /tmp/afileon-booking-harness.log
              exit 1
            fi
            if curl -fsS 'http://127.0.0.1:8788/__test__/count?date=2026-10-25' > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/afileon-booking-harness.log
            exit 1
          fi
          node tests/stress-local-d1-booking.mjs
          stop_worker
          # CI-only signed Stripe-style webhook and D1 payment-state test.
          # The fixture signing string is intentionally public/test-only.
          node tools/generate-local-payment-sql.mjs
          npx wrangler dev ./tests/harness-stripe-worker.mjs --config wrangler.jsonc --local --persist-to "$STATE_DIR" --var LOCAL_D1_TEST:only_action_runner --ip 127.0.0.1 --port 8789 > /tmp/afileon-stripe-harness.log 2>&1 &
          WORKER_PID=$!
          ready=0
          for i in {1..45}; do
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              cat /tmp/afileon-stripe-harness.log
              exit 1
            fi
            if curl -fsS 'http://127.0.0.1:8789/__test__/status' > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/afileon-stripe-harness.log
            exit 1
          fi
          node tests/verify-local-d1-webhook.mjs
          stop_worker
          # CI-only private admin proof: hashed owner sessions and revocation.
          npx wrangler dev ./tests/harness-admin-worker.mjs --config wrangler.jsonc --local --persist-to "$STATE_DIR" --var LOCAL_D1_TEST:only_action_runner --var ADMIN_OWNER_USERNAME:owner@example.invalid --ip 127.0.0.1 --port 8790 > /tmp/afileon-admin-harness.log 2>&1 &
          WORKER_PID=$!
          ready=0
          for i in {1..45}; do
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              cat /tmp/afileon-admin-harness.log
              exit 1
            fi
            # Unauthenticated request intentionally returns HTTP 401.
            if [[ "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8790/__test__/private')" == "401" ]]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/afileon-admin-harness.log
            exit 1
          fi
          node tests/verify-local-d1-admin.mjs
          stop_worker
