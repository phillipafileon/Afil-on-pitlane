name: Afileon Live Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/live-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run live booking smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime, sys

          API = 'https://afileon-live-api-production.up.railway.app'
          MARK = 'afileon-smoke-20260915'
          results = []
          sessions = []
          bookings = []

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(API + path, data=data, method=method)
              req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw = r.read().decode()
                      return r.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try: payload = json.loads(raw) if raw else None
                  except: payload = {'raw': raw}
                  return e.code, payload

          def check(name, cond, detail=''):
              results.append({'name': name, 'pass': bool(cond), 'detail': detail})
              if not cond:
                  print('FAIL:', name, detail)
              else:
                  print('PASS:', name, detail)

          # 1 health + config
          code, health = request('GET', '/health')
          check('health', code == 200 and health.get('ok') is True and health.get('stripe') is True and health.get('version') == 'live-services-v3', f'{code} {health}')
          code, config = request('GET', '/api/config')
          check('config', code == 200 and isinstance(config.get('services'), list), f'{code}, services={len(config.get("services", [])) if isinstance(config, dict) else "?"}')

          # Current availability / choose free dates
          code, avail = request('GET', '/api/availability?months=6')
          check('availability_initial', code == 200 and isinstance(avail.get('busy'), list), f'{code}')
          busy = {x.get('date') for x in avail.get('busy', []) if isinstance(x, dict)}
          today = datetime.date.today()
          def choose(lo, hi):
              for n in range(lo, hi + 1):
                  d = (today + datetime.timedelta(days=n)).isoformat()
                  if d not in busy:
                      return d
              raise RuntimeError('no free date in requested range')
          date1 = choose(30, 60)
          date2 = choose(90, 150)
          if date2 == date1:
              raise RuntimeError('test dates collided')
          print('TEST_DATE_WEBSITE=', date1)
          print('TEST_DATE_PITLANE=', date2)

          def hold_payload(date, channel, suffix):
              return {
                  'service_id': 'pre_track_inspection',
                  'variant_id': 'standard',
                  'booking_date': date,
                  'customer_name': f'Afileon Smoke {channel}',
                  'customer_email': f'{MARK}-{suffix}@example.com',
                  'customer_phone': '07700900000',
                  'service_address': '1 Smoke Test Road, Tunbridge Wells',
                  'postcode': 'TN1 1AA',
                  'vehicle_details': f'Smoke test vehicle - {channel}',
                  'safe_work_area_confirmed': True,
                  'notes': f'{MARK} {channel}'
              }

          # 2 website hold
          code, w = request('POST', '/api/bookings/hold', hold_payload(date1, 'website', 'website'))
          wid = w.get('booking_id') if isinstance(w, dict) else None
          check('website_hold_201', code == 201 and isinstance(wid, str) and wid.startswith('bk_'), f'{code} booking_id={wid}')
          if wid:
              bookings.append(wid)
              pp = w.get('payment_plan') or {}
              check('website_price_plan', pp.get('kind') == 'full' and pp.get('total') == 12000 and pp.get('now') == 12000 and pp.get('balance') == 0, str(pp))
              try:
                  exp = datetime.datetime.fromisoformat(w['hold_expires_at'].replace('Z', '+00:00'))
                  delta = (exp - datetime.datetime.now(datetime.timezone.utc)).total_seconds() / 60
                  check('website_hold_40m', 35 <= delta <= 45, f'{delta:.1f}m')
              except Exception as e:
                  check('website_hold_40m', False, repr(e))

              # checkout immediately so cleanup can expire the Stripe session
              code, wc = request('POST', f'/api/bookings/{wid}/checkout', {})
              wsid = wc.get('session_id') if isinstance(wc, dict) else None
              check('website_checkout', code == 200 and isinstance(wsid, str) and wsid.startswith('cs_') and bool(wc.get('checkout_url')), f'{code} session={wsid}')
              if wsid: sessions.append(wsid)

              # same-date double booking
              code, dup = request('POST', '/api/bookings/hold', hold_payload(date1, 'website-duplicate', 'website-dup'))
              check('website_double_booking_409', code == 409 and isinstance(dup, dict) and dup.get('error') == 'date_unavailable', f'{code} {dup}')

              code, a2 = request('GET', '/api/availability?months=6')
              busy2 = {x.get('date') for x in a2.get('busy', []) if isinstance(x, dict)} if isinstance(a2, dict) else set()
              check('website_date_busy', code == 200 and date1 in busy2, f'{code} date={date1}')

          # 3 Pitlane hold
          code, p = request('POST', '/api/bookings/hold', hold_payload(date2, 'pitlane', 'pitlane'))
          pid = p.get('booking_id') if isinstance(p, dict) else None
          check('pitlane_hold_201', code == 201 and isinstance(pid, str) and pid.startswith('bk_'), f'{code} booking_id={pid}')
          if pid:
              bookings.append(pid)
              pp = p.get('payment_plan') or {}
              check('pitlane_price_plan', pp.get('kind') == 'full' and pp.get('total') == 12000 and pp.get('now') == 12000 and pp.get('balance') == 0, str(pp))
              code, pc = request('POST', f'/api/bookings/{pid}/checkout', {})
              psid = pc.get('session_id') if isinstance(pc, dict) else None
              check('pitlane_checkout', code == 200 and isinstance(psid, str) and psid.startswith('cs_') and bool(pc.get('checkout_url')), f'{code} session={psid}')
              if psid: sessions.append(psid)

              code, dup2 = request('POST', '/api/bookings/hold', hold_payload(date2, 'pitlane-duplicate', 'pitlane-dup'))
              check('pitlane_double_booking_409', code == 409 and isinstance(dup2, dict) and dup2.get('error') == 'date_unavailable', f'{code} {dup2}')

          # 4 Status must still be hold because no payment was completed
          if wid:
              code, wb = request('GET', f'/api/bookings/{wid}')
              check('website_status_hold', code == 200 and wb.get('status') == 'hold' and wb.get('public_id') == wid, f'{code} {wb}')
          if pid:
              code, pb = request('GET', f'/api/bookings/{pid}')
              check('pitlane_status_hold', code == 200 and pb.get('status') == 'hold' and pb.get('public_id') == pid, f'{code} {pb}')

          summary = {
              'test_marker': MARK,
              'website_date': date1,
              'pitlane_date': date2,
              'booking_ids': bookings,
              'stripe_session_ids': sessions,
              'results': results,
              'all_pass': all(x['pass'] for x in results)
          }
          print('SMOKE_RESULT_JSON=' + json.dumps(summary, separators=(',', ':')))
          with open('smoke-result.json', 'w') as f:
              json.dump(summary, f, indent=2)
          if not summary['all_pass']:
              sys.exit(1)
          PY

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-result
          path: smoke-result.json
          if-no-files-found: warn
