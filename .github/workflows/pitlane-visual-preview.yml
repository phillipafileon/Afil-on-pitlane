name: Build Pitlane v0.7.3 Website Style Preview
on:
  push:
    branches: [main]
    paths:
      - 'pitlane-skin/**'
      - '.github/workflows/pitlane-visual-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theme-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: afileon-pitlane-stable-signing-v1
      - name: Check original Pitlane signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore" || { echo "Existing Pitlane signing key missing: no update created"; exit 1; }
          SIGNER=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$SIGNER" = '3ecf73f03717fdbe6e7adae2f959541526c18b5d736c385d2b3a1261d51655af'
      - name: Retrieve pinned Pitlane v0.7.2 release
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM='916734959964e1333d38a5af83d231c18f51386f76845816749576c44d915a7f'
          for URL in 'https://afileonmotorsport.co.uk/downloads/Afileon-Pitlane.apk' 'https://www.afileonmotorsport.co.uk/downloads/Afileon-Pitlane.apk'; do
            rm -f pitlane-v072.apk
            curl -fLsS --retry 1 --connect-timeout 15 --max-time 120 --user-agent 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/125.0 Mobile Safari/537.36' -H 'Accept: application/vnd.android.package-archive,*/*' "$URL" -o pitlane-v072.apk || continue
            printf '%s  pitlane-v072.apk\n' "$CHECKSUM" | sha256sum -c - && exit 0
          done
          echo "::error::Published APK cannot be fetched with matching SHA-256. Original files were not changed."
          exit 1
      - name: Apply website skin without changing Pitlane function code
        run: python3 pitlane-skin/patch_pitlane.py pitlane-v072.apk pitlane-skin/pitlane_website_skin_v073.css pitlane-unsigned.apk
      - name: Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Sign and verify installable preview using existing Pitlane key
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK/zipalign" -f 4 pitlane-unsigned.apk pitlane-aligned.apk
          "$SDK/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out Afileon-Pitlane-v0.7.3-WEBSITE-STYLE.apk pitlane-aligned.apk
          "$SDK/apksigner" verify --verbose --print-certs Afileon-Pitlane-v0.7.3-WEBSITE-STYLE.apk
          CERT=$("$SDK/apksigner" verify --print-certs Afileon-Pitlane-v0.7.3-WEBSITE-STYLE.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$CERT" = '3ecf73f03717fdbe6e7adae2f959541526c18b5d736c385d2b3a1261d51655af'
          "$SDK/aapt" dump badging Afileon-Pitlane-v0.7.3-WEBSITE-STYLE.apk | grep "versionCode='29'"
      - uses: actions/upload-artifact@v4
        with:
          name: PITLANE-0.7.3-WEBSITE-STYLE-SIGNED
          path: Afileon-Pitlane-v0.7.3-WEBSITE-STYLE.apk
          if-no-files-found: error
