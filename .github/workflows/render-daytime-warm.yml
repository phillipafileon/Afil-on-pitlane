# Temporary safety net for Afiléon Motorsport's Render Free API.
# Sends harmless GET /health requests throughout the day and night.
# GitHub scheduled jobs are best-effort: this does not guarantee uptime.
# Five attempts per hour (minute 3, 17, 31, 45, 59): longest planned gap 14 minutes.
# Render free workspace has 750 instance-hours/month: continuous uptime can use 744h in a 31-day month.
# It can still sleep if GitHub's scheduler is late or drops a run; consider paid hosting for reliable payments.
name: Afiléon API 24-hour wake check
on:
  schedule:
    - cron: "3,17,31,45,59 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: afileon-api-24-hour-wake
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake API safely with a read-only request
        run: |
          curl --fail --silent --show-error --location --connect-timeout 20 --max-time 115 --retry 1 --retry-delay 3 \
            --output /dev/null \
            'https://afileon-api-migration-staging.onrender.com/health'
