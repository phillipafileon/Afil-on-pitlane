name: Afileon Shop Integration Smoke Test

on:
  push:
    paths:
      - '.github/workflows/shop-integration-smoke.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway and verify shop safety gate
        shell: bash
        run: |
          set -euo pipefail
          API='https://afileon-live-api-production.up.railway.app'
          ok=0
          for i in $(seq 1 24); do
            if curl -fsS --max-time 15 "$API/health" -o /tmp/health.json && \
               curl -fsS --max-time 15 "$API/api/shop/products" -o /tmp/shop.json; then
              ok=1
              break
            fi
            echo "Waiting for Railway deployment ($i/24)..."
            sleep 10
          done
          test "$ok" = 1
          echo 'HEALTH:'
          cat /tmp/health.json
          echo
          echo 'SHOP:'
          cat /tmp/shop.json
          echo
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          s=json.load(open('/tmp/shop.json'))
          assert h.get('ok') is True, h
          assert s.get('printful_connected') is True, s
          assert s.get('checkout_live') is False, 'Real-money shop checkout must remain gated while Stripe is not live'
          assert s.get('stripe_live') is False, 'Unexpected live Stripe key detected'
          assert s.get('fulfilment_live') is False, 'Printful manufacturing must remain disabled during setup'
          assert s.get('delivery_price') == 499, s
          products=s.get('products') or []
          assert [p.get('slug') for p in products] == ['embroidered-tshirt','embroidered-polo','embroidered-hoodie','beanie','snapback'], products
          expected={
            'embroidered-tshirt':['S','M','L','XL','2XL'],
            'embroidered-polo':['S','M','L','XL','2XL','3XL','4XL','5XL'],
            'embroidered-hoodie':['S','M','L','XL','2XL','3XL'],
            'beanie':['Black','White'],
            'snapback':['Dark Navy'],
          }
          for p in products:
            assert [v.get('label') for v in p.get('variants',[])] == expected[p['slug']], p
          print('PASS: health, catalogue, variants and live-money safety gate')
          PY
