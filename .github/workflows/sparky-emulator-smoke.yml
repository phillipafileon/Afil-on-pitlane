name: Sparky Android Emulator Smoke Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'spark/**'
      - 'tools/test_sparky_android_emulator.py'
      - '.github/workflows/sparky-emulator-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK manager
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native Android build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=SPARKY CI EMULATOR TEST ONLY" -keyalg RSA -keysize 2048 -validity 3
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build temporary emulator architecture — never distribute this APK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("spark/build.gradle")
          content = path.read_text()
          assert "abiFilters 'arm64-v8a'" in content
          path.write_text(content.replace("abiFilters 'arm64-v8a'", "abiFilters 'x86_64'"))
          PY
          mkdir -p spark/src/main/cpp/vendor/llama.cpp
          git -C spark/src/main/cpp/vendor/llama.cpp init
          git -C spark/src/main/cpp/vendor/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C spark/src/main/cpp/vendor/llama.cpp fetch --depth 1 origin 9d1878a4354e743529fbe09e7350a957f5e39e9a
          git -C spark/src/main/cpp/vendor/llama.cpp checkout --detach FETCH_HEAD
          gradle --no-daemon :spark:assembleDebug
      - name: Start virtual Android phone and test Sparky UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: python tools/test_sparky_android_emulator.py
      - name: Save emulator smoke-test result
        if: always()
        shell: bash
        run: |
          echo "This emulator verifies UI/startup, not local AI speed or offline speech hardware performance." >> "$GITHUB_STEP_SUMMARY"
