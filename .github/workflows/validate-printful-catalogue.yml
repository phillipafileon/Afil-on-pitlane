name: Validate Printful catalogue integration

on:
  push:
    branches: ['**']
    paths:
      - 'live-services/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check dynamic patch syntax
        run: node --check live-services/runtime_printful_dynamic_catalogue.cjs
      - name: Build live API image
        run: docker build -f live-services/Dockerfile live-services