plugins { id 'com.android.application' }
android {
    namespace 'uk.co.afileonmotorsport.bookingmanager'
    compileSdk 35
    defaultConfig {
        applicationId 'uk.co.afileonmotorsport.bookingmanager'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    signingConfigs {
        compatible {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.compatible }
        release { signingConfig signingConfigs.compatible; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
